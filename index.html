
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/spider-man-comic-new-seeklogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akash Pratap Singh | Superhero Portfolio (Spider-Verse, Green Lantern Corps, Wakanda Vibranium)</title>
    <!-- Prevent Theme Flash (FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var theme = (saved === 'green-lantern' || saved === 'black-panther') ? saved : 'spiderman';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add('theme-' + theme);
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Permanent+Marker&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      @import "tailwindcss";

      /* CSS Custom Properties for Themes */
      :root, :root[data-theme="spiderman"] {
        --theme-bg: #0A0B1E;
        --theme-text: #F5F5F5;
        --theme-primary: #FF375F;
        --theme-secondary: #2A7FFF;
        --theme-accent: #FFDE00;
        --theme-border: #000000;
      }

      :root[data-theme="green-lantern"] {
        --theme-bg: #050D0A;
        --theme-text: #F5FFF8;
        --primary-emerald: #00FF66;
        --deep-green: #008F4C;
        --energy-glow: #7CFFB2;
        --theme-border: #00FF66;
      }

      :root[data-theme="black-panther"] {
        --theme-bg: #08090D;
        --theme-text: #F5F5F5;
        --primary-vibranium: #7B2CFF;
        --energy-cyan: #00E5FF;
        --metallic-silver: #A9B3C1;
        --theme-border: #7B2CFF;
      }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #0A0B1E;
        color: #F5F5F5;
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
      }

      :root[data-theme="green-lantern"] body {
        background-color: #050D0A;
        color: #F5FFF8;
      }

      :root[data-theme="black-panther"] body {
        background-color: #08090D;
        color: #F5F5F5;
      }

      .font-comic { font-family: 'Bangers', cursive; }
      .font-marker { font-family: 'Permanent+Marker', cursive; }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
      
      /* Halftone Pattern - Refined & Subtle */
      .halftone {
        background-image: radial-gradient(circle, rgba(255,255,255,0.03) 0.8px, transparent 0.8px);
        background-size: 24px 24px;
      }

      /* Comic Ben-Day Dots Pattern */
      .comic-dots {
        background-image: radial-gradient(circle, rgba(255, 55, 95, 0.15) 1px, transparent 1px), radial-gradient(circle, rgba(42, 127, 255, 0.12) 1px, transparent 1px);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
      }

      /* Green Lantern Construct Grid */
      .construct-grid {
        background-image: 
          linear-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      /* Green Lantern Cosmic Circuit Glow */
      .construct-circuit {
        background-image:
          radial-gradient(circle at 10% 10%, rgba(0, 255, 102, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(124, 255, 178, 0.02) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px, 40px 40px;
      }

      /* Wakandan Vibranium Tech Grid & Geometric Pattern */
      .wakanda-grid {
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(123, 44, 255, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(123, 44, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
        background-size: 28px 28px, 56px 56px, 56px 56px;
      }

      /* Wakandan Geometric Chevron Motif */
      .wakanda-chevron-strip {
        background: repeating-linear-gradient(
          -45deg,
          rgba(123, 44, 255, 0.25),
          rgba(123, 44, 255, 0.25) 6px,
          transparent 6px,
          transparent 12px,
          rgba(0, 229, 255, 0.25) 12px,
          rgba(0, 229, 255, 0.25) 18px,
          transparent 18px,
          transparent 24px
        );
      }

      /* Spidey Sense Alert Animation */
      @keyframes spidey-sense {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 6px rgba(255, 55, 95, 0.6)) drop-shadow(0 0 12px rgba(255, 222, 0, 0.5));
        }
        50% {
          transform: scale(1.08) rotate(-1deg);
          filter: drop-shadow(0 0 16px rgba(255, 55, 95, 0.95)) drop-shadow(0 0 24px rgba(255, 222, 0, 0.9));
        }
      }
      .animate-spidey-sense {
        animation: spidey-sense 1.6s ease-in-out infinite;
      }

      /* Kimoyo Beads Shimmer */
      @keyframes kimoyo-pulse {
        0%, 100% {
          box-shadow: 0 0 8px rgba(123, 44, 255, 0.6), inset 0 0 6px rgba(0, 229, 255, 0.4);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 16px rgba(0, 229, 255, 0.9), inset 0 0 10px rgba(123, 44, 255, 0.7);
          transform: scale(1.1);
        }
      }
      .animate-kimoyo {
        animation: kimoyo-pulse 3s ease-in-out infinite;
      }

      /* Emerald Energy Glow Helpers */
      .emerald-text-glow {
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.7), 0 0 25px rgba(124, 255, 178, 0.4);
      }
      .emerald-box-glow {
        box-shadow: 0 0 20px rgba(0, 255, 102, 0.25), inset 0 0 15px rgba(0, 255, 102, 0.1);
      }
      .emerald-box-glow-lg {
        box-shadow: 0 0 35px rgba(0, 255, 102, 0.35), 0 0 10px rgba(124, 255, 178, 0.2);
      }

      /* Wakandan Vibranium Glow Helpers */
      .vibranium-text-glow {
        text-shadow: 0 0 12px rgba(123, 44, 255, 0.75), 0 0 24px rgba(0, 229, 255, 0.45);
      }
      .vibranium-box-glow {
        box-shadow: 0 0 20px rgba(123, 44, 255, 0.3), inset 0 0 15px rgba(0, 229, 255, 0.1);
      }
      .vibranium-box-glow-lg {
        box-shadow: 0 0 35px rgba(123, 44, 255, 0.4), 0 0 15px rgba(0, 229, 255, 0.25);
      }

      /* Power Ring Pulsing Construct Animation */
      @keyframes ring-pulse {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          filter: drop-shadow(0 0 12px rgba(0, 255, 102, 0.5));
        }
        50% {
          transform: scale(1.03) rotate(3deg);
          filter: drop-shadow(0 0 24px rgba(124, 255, 178, 0.8));
        }
      }
      .animate-ring-pulse {
        animation: ring-pulse 6s ease-in-out infinite;
      }

      /* Wakandan Vibranium Kinetic Pulse Animation */
      @keyframes vibranium-pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 12px rgba(123, 44, 255, 0.6)) drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
        }
        50% {
          transform: scale(1.025);
          filter: drop-shadow(0 0 26px rgba(123, 44, 255, 0.85)) drop-shadow(0 0 32px rgba(0, 229, 255, 0.6));
        }
      }
      .animate-vibranium-pulse {
        animation: vibranium-pulse 5s ease-in-out infinite;
      }

      /* Emerald construct energy scanline */
      @keyframes construct-sweep {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      /* Reduced Motion Accessibility */
      @media (prefers-reduced-motion: reduce) {
        .animate-ring-pulse,
        .animate-vibranium-pulse,
        .animate-float-slow,
        .glitch::before,
        .glitch::after,
        .grain::before {
          animation: none !important;
          transition: none !important;
        }
      }

      /* CRT Scanlines Effect */
      .scanlines::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 100;
        background-size: 100% 3px, 3px 100%;
        pointer-events: none;
        opacity: 0.3;
      }

      /* Subtle Film Grain */
      .grain::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.04;
        pointer-events: none;
        z-index: 50;
        animation: grain 8s steps(10) infinite;
      }

      @keyframes grain {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -10%); }
        20% { transform: translate(-15%, 5%); }
        30% { transform: translate(7%, -25%); }
        40% { transform: translate(-5%, 25%); }
        50% { transform: translate(-15%, 10%); }
        60% { transform: translate(15%, 0%); }
        70% { transform: translate(0%, 15%); }
        80% { transform: translate(3%, 35%); }
        90% { transform: translate(-10%, 10%); }
      }

      /* REFINED GLITCH EFFECT */
      .glitch {
        position: relative;
        display: inline-block;
        --glitch-color-1: #00FFFF;
        --glitch-color-2: #FF375F;
        --glitch-duration: 4s;
        --glitch-intensity: 1;
      }
      
      .glitch::before, .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        pointer-events: none;
        visibility: hidden;
      }

      .glitch::before {
        left: calc(-2px * var(--glitch-intensity));
        text-shadow: calc(2px * var(--glitch-intensity)) 0 var(--glitch-color-1);
        animation: glitch-burst-1 var(--glitch-duration) infinite linear;
      }

      .glitch::after {
        left: calc(2px * var(--glitch-intensity));
        text-shadow: calc(-2px * var(--glitch-intensity)) 0 var(--glitch-color-2);
        animation: glitch-burst-2 var(--glitch-duration) infinite linear;
      }

      .glitch:hover::before, .glitch:hover::after, .glitch-active::before, .glitch-active::after {
        visibility: visible;
      }

      @keyframes glitch-burst-1 {
        0%, 15%, 20%, 45%, 50%, 85%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 0; }
        16% { clip-path: inset(10% 0 85% 0); transform: translate(calc(-8px * var(--glitch-intensity)), 2px); opacity: 1; }
        17% { clip-path: inset(60% 0 10% 0); transform: translate(calc(5px * var(--glitch-intensity)), -2px); }
        18% { clip-path: inset(30% 0 40% 0); transform: translate(calc(-3px * var(--glitch-intensity)), 0); }
        19% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 1; }
        46% { clip-path: inset(80% 0 5% 0); transform: translate(calc(7px * var(--glitch-intensity))); opacity: 1; }
        47% { clip-path: inset(15% 0 65% 0); transform: translate(calc(-10px * var(--glitch-intensity))); }
        48% { clip-path: inset(50% 0 20% 0); transform: translate(calc(4px * var(--glitch-intensity))); }
        49% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 1; }
      }

      @keyframes glitch-burst-2 {
        0%, 18%, 23%, 48%, 53%, 88%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 0; }
        19% { clip-path: inset(85% 0 10% 0); transform: translate(calc(8px * var(--glitch-intensity)), -2px); opacity: 1; }
        20% { clip-path: inset(15% 0 60% 0); transform: translate(calc(-5px * var(--glitch-intensity)), 2px); }
        21% { clip-path: inset(45% 0 35% 0); transform: translate(calc(3px * var(--glitch-intensity)), 0); }
        22% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 1; }
        49% { clip-path: inset(5% 0 80% 0); transform: translate(calc(-7px * var(--glitch-intensity))); opacity: 1; }
        50% { clip-path: inset(65% 0 15% 0); transform: translate(calc(10px * var(--glitch-intensity))); }
        51% { clip-path: inset(25% 0 55% 0); transform: translate(calc(-4px * var(--glitch-intensity))); }
        52% { clip-path: inset(0 0 0 0); transform: translate(0); opacity: 1; }
      }

      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(2deg); }
      }

      .animate-float-slow {
        animation: float-slow 10s ease-in-out infinite;
      }

      .thwip-active:active {
        transform: scale(0.95);
        transition: transform 0.1s;
      }

      .split-hover:hover {
        background: linear-gradient(90deg, #FF375F 50%, #2A7FFF 50%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
